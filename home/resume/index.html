<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>何午欤 · 简历</title>
<link rel="stylesheet" href="/style.css">
<style>
  .resume-bar { text-align: center; padding: 24px 0 4px; }
  .resume-bar h1 { margin: 12px 0 4px; }
  .back { color: var(--accent-3); text-decoration: none; font-weight: 600; }
  .resume-wrap { max-width: 860px; margin: 16px auto 48px; padding: 0 20px; }
  .resume-frame {
    width: 100%; height: 88vh; border: none; border-radius: 16px;
    background: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.08);
  }
</style>
</head>
<body>
  <div class="resume-bar">
    <a class="back" href="/">← 返回主页</a>
    <h1>我的简历</h1>
    <a class="btn btn-primary" href="/resume/resume.pdf" download style="margin-top: 10px">⬇ 下载 PDF</a>
  </div>
  <div class="resume-wrap">
    <iframe class="resume-frame" src="/resume/resume.pdf" title="简历"></iframe>
  </div>
</body>
</html>
